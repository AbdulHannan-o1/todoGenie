apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todogenie.fullname" . }}-secrets
  labels:
    {{- include "todogenie.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: {{ .Values.database.url | quote }}

  # Application secrets
  {{- if .Values.global.betterAuthSecret }}
  BETTER_AUTH_SECRET: {{ .Values.global.betterAuthSecret | quote }}
  {{- end }}

  {{- if .Values.global.openaiApiKey }}
  OPENROUTER_API_KEY: {{ .Values.global.openaiApiKey | quote }}
  {{- else }}
  OPENROUTER_API_KEY: "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"
  {{- end }}

  {{- if .Values.global.groqApiKey }}
  GROQ_API_KEY: {{ .Values.global.groqApiKey | quote }}
  {{- end }}

  {{- if .Values.global.bonsaiApiKey }}
  BONSAI_API_KEY: {{ .Values.global.bonsaiApiKey | quote }}
  {{- end }}